<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SECTOR 7 — Hologram Recon</title>
<style>
:root{
  --void:#01070c;
  --grid:#0b2b38;
  --holo:#4fe3ff;
  --holo-soft:rgba(79,227,255,.28);
  --deep:#0b3a4a;
  --hostile:#ff3d7f;
  --data:#ffc857;
  --ghost:#d8fbff;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--void);overflow:hidden;font-family:var(--mono)}
body{display:grid;place-items:center;color:var(--ghost)}

#stage{position:relative;width:100vw;height:100vh;overflow:hidden;cursor:crosshair}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---- atmosphere ---- */
#scan{position:absolute;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(to bottom,rgba(79,227,255,.045) 0 1px,transparent 1px 3px);
  mix-blend-mode:screen}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:6;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(1,7,12,.85) 100%)}
#damage{position:absolute;inset:0;pointer-events:none;z-index:7;opacity:0;
  box-shadow:inset 0 0 140px 30px rgba(255,61,127,.75);transition:opacity .12s linear}

/* ---- HUD ---- */
.hud{position:absolute;z-index:8;pointer-events:none;
  font-size:11px;letter-spacing:.18em;text-transform:uppercase}

#top{top:0;left:0;right:0;padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.panel{border:1px solid var(--holo-soft);background:rgba(2,20,28,.55);backdrop-filter:blur(2px);
  padding:10px 14px;position:relative}
.panel::before,.panel::after{content:'';position:absolute;width:7px;height:7px;border:1px solid var(--holo)}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.lbl{color:rgba(79,227,255,.55);font-size:9px;letter-spacing:.3em}
.val{color:var(--holo);font-size:16px;letter-spacing:.1em;margin-top:3px;
  text-shadow:0 0 12px rgba(79,227,255,.7)}
.val.warn{color:var(--hostile);text-shadow:0 0 12px rgba(255,61,127,.7)}

#bar{width:150px;height:5px;margin-top:7px;border:1px solid var(--holo-soft);position:relative}
#barfill{position:absolute;inset:1px;width:100%;transform-origin:left;background:var(--holo);
  box-shadow:0 0 10px var(--holo);transition:transform .18s ease-out}
#barfill.warn{background:var(--hostile);box-shadow:0 0 10px var(--hostile)}

#cores{display:flex;gap:5px;margin-top:7px}
.core{width:15px;height:15px;border:1px solid rgba(255,200,87,.35);transform:rotate(45deg)}
.core.on{background:var(--data);border-color:var(--data);box-shadow:0 0 10px var(--data)}

#log{position:absolute;left:20px;bottom:20px;z-index:8;max-width:min(52vw,420px)}
#log div{color:var(--holo);opacity:.8;font-size:10.5px;letter-spacing:.16em;margin-top:3px;
  text-shadow:0 0 8px rgba(79,227,255,.5)}
#log div.alert{color:var(--hostile);text-shadow:0 0 8px rgba(255,61,127,.6)}
#log div.good{color:var(--data);text-shadow:0 0 8px rgba(255,200,87,.6)}

#keys{position:absolute;right:20px;bottom:20px;z-index:8;text-align:right;
  color:rgba(79,227,255,.4);font-size:9.5px;letter-spacing:.22em;line-height:1.8}
#keys b{color:var(--holo);font-weight:400}

/* ---- overlays ---- */
#veil{position:absolute;inset:0;z-index:20;display:grid;place-items:center;text-align:center;
  background:radial-gradient(ellipse at center,rgba(1,7,12,.86),rgba(1,7,12,.98));padding:24px}
#veil.hide{display:none}
#veil h1{font-size:clamp(26px,6vw,52px);font-weight:400;letter-spacing:.42em;color:var(--holo);
  text-shadow:0 0 26px rgba(79,227,255,.65);margin-left:.42em}
#veil h1.bad{color:var(--hostile);text-shadow:0 0 26px rgba(255,61,127,.6)}
#veil h1.good{color:var(--data);text-shadow:0 0 26px rgba(255,200,87,.6)}
#veil p{margin-top:18px;font-size:11.5px;letter-spacing:.2em;line-height:2.1;
  color:rgba(216,251,255,.62);text-transform:uppercase;max-width:44ch}
#veil button{margin-top:30px;background:transparent;color:var(--holo);border:1px solid var(--holo);
  padding:12px 34px;font-family:var(--mono);font-size:11px;letter-spacing:.34em;text-transform:uppercase;
  cursor:pointer;transition:.18s}
#veil button:hover,#veil button:focus-visible{background:var(--holo);color:var(--void);
  box-shadow:0 0 28px rgba(79,227,255,.65);outline:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="scan"></div><div id="vignette"></div><div id="damage"></div>

  <div class="hud" id="top">
    <div class="panel">
      <div class="lbl">Suit integrity</div>
      <div class="val" id="hpv">100%</div>
      <div id="bar"><div id="barfill"></div></div>
    </div>
    <div class="panel" style="text-align:center">
      <div class="lbl">Data cores</div>
      <div id="cores"></div>
    </div>
    <div class="panel" style="text-align:right">
      <div class="lbl">Pulse scan</div>
      <div class="val" id="scanv">READY</div>
    </div>
  </div>

  <div id="log"></div>
  <div id="keys"><b>CLICK</b> move &nbsp;·&nbsp; <b>SPACE</b> pulse scan &nbsp;·&nbsp; <b>R</b> restart</div>

  <div id="veil">
    <div>
      <h1 id="vtitle">SECTOR 7</h1>
      <p id="vtext">
        เมืองร้างหลังเหตุการณ์ blackout · เก็บ data core ให้ครบ 5 ชิ้น แล้วไปยัง extraction pad<br><br>
        คลิกเพื่อเดิน · หลบ <span style="color:#ff3d7f">stalker</span> ให้พ้นกรวยสายตา · กำแพงบังสายตาได้
      </p>
      <button id="vbtn">เริ่มภารกิจ</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ══════════════ CONFIG ══════════════ */
const W=68,H=52,TS=30;          // world in tiles
const CORES_NEEDED=5;
const FOV_R=9.5;                 // player sight radius (tiles)
const P_SPEED=3.6, E_PATROL=1.7, E_CHASE=3.05;
const E_SIGHT=8.5, E_CONE=Math.PI*0.32;
const DPS=26, SCAN_CD=9;

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let VW=0,VH=0,DPR=1;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  VW=innerWidth; VH=innerHeight;
  cv.width=VW*DPR; cv.height=VH*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize); resize();

/* ══════════════ WORLD ══════════════ */
let map,explored,visible,reach;
const I=(x,y)=>y*W+x;
const solid=(x,y)=>x<0||y<0||x>=W||y>=H||map[I(x,y)]===1;

function genCity(){
  map=new Uint8Array(W*H).fill(1);
  const set=(x,y,v)=>{if(x>1&&y>1&&x<W-2&&y<H-2)map[I(x,y)]=v;};
  const xs=[],ys=[];
  for(let x=4;x<W-6;x+=7+(Math.random()*5|0)) xs.push(x);
  for(let y=4;y<H-6;y+=6+(Math.random()*4|0)) ys.push(y);
  for(const rx of xs) for(let y=2;y<H-2;y++){set(rx,y,0);set(rx+1,y,0);}
  for(const ry of ys) for(let x=2;x<W-2;x++){set(x,ry,0);set(x,ry+1,0);}

  for(let i=0;i<xs.length-1;i++)for(let j=0;j<ys.length-1;j++){
    const x0=xs[i]+2,x1=xs[i+1]-1,y0=ys[j]+2,y1=ys[j+1]-1;
    if(x1-x0<3||y1-y0<3) continue;
    const r=Math.random();
    if(r<0.5){                                   // ruined building, hollow + doors
      for(let a=x0+1;a<x1;a++)for(let b=y0+1;b<y1;b++) set(a,b,0);
      for(let d=0,n=1+(Math.random()*2|0);d<n;d++){
        const s=Math.random()*4|0;
        if(s===0) set(x0+1+(Math.random()*(x1-x0-1)|0),y0,0);
        else if(s===1) set(x0+1+(Math.random()*(x1-x0-1)|0),y1,0);
        else if(s===2) set(x0,y0+1+(Math.random()*(y1-y0-1)|0),0);
        else set(x1,y0+1+(Math.random()*(y1-y0-1)|0),0);
      }
      if(Math.random()<0.45){                     // internal partition
        const my=y0+1+((y1-y0)>>1);
        for(let a=x0+1;a<x1;a++) set(a,my,1);
        set(x0+1+(Math.random()*(x1-x0-1)|0),my,0);
      }
    }else if(r<0.76){                             // collapsed lot with pillars
      for(let a=x0;a<=x1;a++)for(let b=y0;b<=y1;b++) set(a,b,0);
      for(let a=x0;a<=x1;a+=2)for(let b=y0;b<=y1;b+=2) if(Math.random()<0.55) set(a,b,1);
    }                                             // else: solid tower
  }
  for(let k=0;k<W*H*0.012;k++){                   // street rubble = cover
    const x=2+(Math.random()*(W-4)|0), y=2+(Math.random()*(H-4)|0);
    if(map[I(x,y)]===0) set(x,y,1);
  }
}

function floodReach(sx,sy){
  reach=new Uint8Array(W*H);
  const q=[I(sx,sy)]; reach[q[0]]=1;
  for(let h=0;h<q.length;h++){
    const i=q[h], x=i%W, y=(i/W)|0;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=W||ny>=H)continue;
      const ni=I(nx,ny);
      if(!reach[ni]&&map[ni]===0){reach[ni]=1;q.push(ni);}
    }
  }
  return q.length;
}

/* ══════════════ FOV / LOS ══════════════ */
function castFOV(px,py,radius,mark){
  const steps=radius/0.22;
  for(let i=0;i<260;i++){
    const a=i/260*Math.PI*2, dx=Math.cos(a)*0.22, dy=Math.sin(a)*0.22;
    let x=px,y=py;
    for(let s=0;s<steps;s++){
      x+=dx;y+=dy;
      const tx=x|0,ty=y|0;
      if(tx<0||ty<0||tx>=W||ty>=H)break;
      mark(I(tx,ty));
      if(map[I(tx,ty)]===1)break;
    }
  }
  mark(I(px|0,py|0));
}
function updateFOV(){
  visible.fill(0);
  castFOV(P.x,P.y,FOV_R,i=>{visible[i]=1;explored[i]=1;});
}
function lineClear(x0,y0,x1,y1){
  const dx=x1-x0,dy=y1-y0,d=Math.hypot(dx,dy),n=Math.ceil(d/0.2);
  for(let i=1;i<n;i++){
    const t=i/n, x=(x0+dx*t)|0, y=(y0+dy*t)|0;
    if(solid(x,y))return false;
  }
  return true;
}

/* ══════════════ A* ══════════════ */
function astar(sx,sy,tx,ty){
  sx|=0;sy|=0;tx|=0;ty|=0;
  if(solid(tx,ty))return null;
  const s=I(sx,sy),g=I(tx,ty);
  if(s===g)return [];
  const gScore=new Float32Array(W*H).fill(Infinity), came=new Int32Array(W*H).fill(-1),
        closed=new Uint8Array(W*H), heap=[], hv=[];
  const hcost=(x,y)=>{const a=Math.abs(x-tx),b=Math.abs(y-ty);return (a+b)+(Math.SQRT2-2)*Math.min(a,b);};
  function push(i,f){heap.push(i);hv.push(f);let c=heap.length-1;
    while(c>0){const p=(c-1)>>1;if(hv[p]<=hv[c])break;[heap[p],heap[c]]=[heap[c],heap[p]];[hv[p],hv[c]]=[hv[c],hv[p]];c=p;}}
  function pop(){const top=heap[0];const li=heap.pop(),lv=hv.pop();
    if(heap.length){heap[0]=li;hv[0]=lv;let c=0;
      for(;;){const l=c*2+1,r=l+1;let m=c;
        if(l<heap.length&&hv[l]<hv[m])m=l;
        if(r<heap.length&&hv[r]<hv[m])m=r;
        if(m===c)break;[heap[m],heap[c]]=[heap[c],heap[m]];[hv[m],hv[c]]=[hv[c],hv[m]];c=m;}}
    return top;}
  gScore[s]=0; push(s,hcost(sx,sy));
  let guard=0;
  while(heap.length&&guard++<20000){
    const cur=pop();
    if(cur===g){
      const path=[];let n=g;
      while(n!==s){path.push([n%W+0.5,((n/W)|0)+0.5]);n=came[n];}
      return path.reverse();
    }
    if(closed[cur])continue; closed[cur]=1;
    const cx=cur%W, cy=(cur/W)|0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy)continue;
      const nx=cx+dx,ny=cy+dy;
      if(solid(nx,ny))continue;
      if(dx&&dy&&(solid(cx+dx,cy)||solid(cx,cy+dy)))continue;  // no corner cutting
      const ni=I(nx,ny); if(closed[ni])continue;
      const t=gScore[cur]+(dx&&dy?Math.SQRT2:1);
      if(t<gScore[ni]){gScore[ni]=t;came[ni]=cur;push(ni,t+hcost(nx,ny));}
    }
  }
  return null;
}
function smooth(path,fx,fy){                       // string-pulling
  if(!path||path.length<2)return path;
  const out=[];let cx=fx,cy=fy,i=0;
  while(i<path.length){
    let j=path.length-1;
    while(j>i&&!lineClear(cx,cy,path[j][0],path[j][1]))j--;
    out.push(path[j]);cx=path[j][0];cy=path[j][1];i=j+1;
  }
  return out;
}

/* ══════════════ ENTITIES ══════════════ */
const P={x:0,y:0,hp:100,path:[],ang:0,scan:0};
let enemies=[],cores=[],exit={x:0,y:0},collected=0;
let state='menu', time=0, camX=0, camY=0, pulse=null, shake=0, lastTile=-1;

function randReach(minDistFrom,mx,my){
  for(let t=0;t<4000;t++){
    const x=2+(Math.random()*(W-4)|0), y=2+(Math.random()*(H-4)|0);
    if(!reach[I(x,y)])continue;
    if(minDistFrom!=null&&Math.hypot(x-mx,y-my)<minDistFrom)continue;
    return {x:x+0.5,y:y+0.5};
  }
  return {x:mx,y:my};
}

function init(){
  do{ genCity();
      let sx=0,sy=0;
      outer: for(let y=3;y<H-3;y++)for(let x=3;x<W-3;x++) if(map[I(x,y)]===0){sx=x;sy=y;break outer;}
      P.x=sx+0.5;P.y=sy+0.5;
  }while(floodReach(P.x|0,P.y|0)<W*H*0.16);

  explored=new Uint8Array(W*H); visible=new Uint8Array(W*H);
  P.hp=100;P.path=[];P.scan=0;P.ang=-Math.PI/2;
  collected=0; pulse=null; shake=0; lastTile=-1;

  cores=[];
  for(let i=0;i<CORES_NEEDED;i++){
    const p=randReach(14,P.x,P.y);
    cores.push({x:p.x,y:p.y,taken:false});
  }
  exit=randReach(24,P.x,P.y);

  enemies=[];
  for(let i=0;i<7;i++){
    const p=randReach(16,P.x,P.y);
    enemies.push({x:p.x,y:p.y,ang:Math.random()*6.28,path:[],alert:0,
                  lastSeen:null,repath:0,speed:E_PATROL});
  }
  camX=P.x*TS;camY=P.y*TS;
  updateFOV();
  logLines=[]; say('LINK ESTABLISHED · SECTOR 7 GRID ONLINE');
  say('OBJECTIVE: RECOVER '+CORES_NEEDED+' DATA CORES');
  drawHUD();
}

/* ══════════════ LOG / HUD ══════════════ */
let logLines=[];
const logEl=document.getElementById('log');
function say(t,cls){
  logLines.push({t,cls:cls||'',age:0});
  if(logLines.length>4)logLines.shift();
  logEl.innerHTML=logLines.map(l=>`<div class="${l.cls}">&gt; ${l.t}</div>`).join('');
}
const hpv=document.getElementById('hpv'),barfill=document.getElementById('barfill'),
      coresEl=document.getElementById('cores'),scanv=document.getElementById('scanv'),
      dmgEl=document.getElementById('damage');
function drawHUD(){
  const hp=Math.max(0,Math.round(P.hp));
  hpv.textContent=hp+'%';
  hpv.classList.toggle('warn',hp<40);
  barfill.style.transform='scaleX('+(hp/100)+')';
  barfill.classList.toggle('warn',hp<40);
  coresEl.innerHTML=Array.from({length:CORES_NEEDED},(_,i)=>
    `<div class="core${i<collected?' on':''}"></div>`).join('');
  scanv.textContent=P.scan>0?Math.ceil(P.scan)+'S':'READY';
  scanv.classList.toggle('warn',P.scan>0);
}

/* ══════════════ AUDIO ══════════════ */
let AC=null;
function beep(f,dur,type,vol){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(vol||0.05,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur);
  }catch(e){}
}

/* ══════════════ INPUT ══════════════ */
function screenToWorld(sx,sy){
  return {x:(sx-VW/2+camX)/TS, y:(sy-VH/2+camY)/TS};
}
cv.addEventListener('pointerdown',e=>{
  if(state!=='play')return;
  const r=cv.getBoundingClientRect();
  const w=screenToWorld(e.clientX-r.left,e.clientY-r.top);
  let tx=w.x|0, ty=w.y|0;
  if(solid(tx,ty)||!reach[I(tx,ty)]){                 // snap to nearest walkable
    let best=null,bd=1e9;
    for(let y=ty-4;y<=ty+4;y++)for(let x=tx-4;x<=tx+4;x++){
      if(x<0||y<0||x>=W||y>=H||solid(x,y)||!reach[I(x,y)])continue;
      const d=Math.hypot(x-w.x,y-w.y); if(d<bd){bd=d;best=[x,y];}
    }
    if(!best){say('NO ROUTE — OBSTRUCTED','alert');beep(120,.12,'square',.04);return;}
    tx=best[0];ty=best[1];
  }
  const raw=astar(P.x,P.y,tx,ty);
  if(!raw){say('NO ROUTE — OBSTRUCTED','alert');beep(120,.12,'square',.04);return;}
  P.path=smooth(raw,P.x,P.y);
  beep(880,.06,'sine',.03);
});
addEventListener('keydown',e=>{
  if(e.code==='Space'){
    e.preventDefault();
    if(state==='play'&&P.scan<=0){
      P.scan=SCAN_CD; pulse={r:0,life:1};
      castFOV(P.x,P.y,20,i=>{explored[i]=1;});
      say('PULSE SCAN — GRID MAPPED · SIGNAL EXPOSED','good');
      beep(220,.5,'sine',.06); beep(440,.35,'sine',.03);
      for(const en of enemies) if(Math.hypot(en.x-P.x,en.y-P.y)<16){
        en.lastSeen={x:P.x,y:P.y}; en.alert=Math.max(en.alert,1.2); en.repath=0;
      }
    }
  }
  if(e.code==='KeyR'&&state!=='menu') start();
});

/* ══════════════ UPDATE ══════════════ */
function moveAlong(ent,speed,dt){
  let budget=speed*dt;
  while(budget>0&&ent.path.length){
    const [tx,ty]=ent.path[0];
    const dx=tx-ent.x, dy=ty-ent.y, d=Math.hypot(dx,dy);
    if(d<1e-4){ent.path.shift();continue;}
    ent.ang=Math.atan2(dy,dx);
    if(d<=budget){ent.x=tx;ent.y=ty;budget-=d;ent.path.shift();}
    else{ent.x+=dx/d*budget;ent.y+=dy/d*budget;budget=0;}
  }
}
function sees(en){
  const dx=P.x-en.x, dy=P.y-en.y, d=Math.hypot(dx,dy);
  if(d>E_SIGHT)return false;
  if(d>1.2){
    let diff=Math.atan2(dy,dx)-en.ang;
    while(diff>Math.PI)diff-=6.283; while(diff<-Math.PI)diff+=6.283;
    if(Math.abs(diff)>E_CONE)return false;
  }
  return lineClear(en.x,en.y,P.x,P.y);
}

function update(dt){
  time+=dt;
  if(state!=='play')return;

  moveAlong(P,P_SPEED,dt);
  const tile=I(P.x|0,P.y|0);
  if(tile!==lastTile){lastTile=tile;updateFOV();}

  if(P.scan>0){P.scan=Math.max(0,P.scan-dt);}
  if(pulse){pulse.r+=dt*34;pulse.life-=dt*0.55;if(pulse.life<=0)pulse=null;}

  // camera
  const tcx=P.x*TS,tcy=P.y*TS, k=1-Math.pow(0.0016,dt);
  camX+=(tcx-camX)*k; camY+=(tcy-camY)*k;
  shake=Math.max(0,shake-dt*2.4);

  // cores
  for(const c of cores){
    if(c.taken)continue;
    if(Math.hypot(c.x-P.x,c.y-P.y)<0.7){
      c.taken=true;collected++;
      beep(660,.14,'triangle',.06);setTimeout(()=>beep(990,.22,'triangle',.05),90);
      say(`DATA CORE ${collected}/${CORES_NEEDED} SECURED`,'good');
      if(collected>=CORES_NEEDED) say('ALL CORES SECURED — REACH EXTRACTION PAD','good');
      drawHUD();
    }
  }
  // extraction
  if(collected>=CORES_NEEDED&&Math.hypot(exit.x-P.x,exit.y-P.y)<1.2){ finish(true); return; }

  // enemies
  let touching=false, anyAlert=false;
  for(const en of enemies){
    const canSee=sees(en);
    if(canSee){
      if(en.alert<=0){say('CONTACT — STALKER LOCKED ON','alert');beep(150,.3,'sawtooth',.05);shake=1;}
      en.alert=2.6; en.lastSeen={x:P.x,y:P.y};
    }else en.alert=Math.max(0,en.alert-dt);
    if(en.alert>0)anyAlert=true;

    en.speed=en.alert>0?E_CHASE:E_PATROL;
    en.repath-=dt;
    if(en.repath<=0||!en.path.length){
      en.repath=en.alert>0?0.35:1.2;
      let tgt;
      if(en.alert>0&&en.lastSeen) tgt=en.lastSeen;
      else{ en.lastSeen=null; tgt=randReach(null); }
      const raw=astar(en.x,en.y,tgt.x|0,tgt.y|0);
      en.path=raw?smooth(raw,en.x,en.y):[];
    }
    moveAlong(en,en.speed,dt);

    if(Math.hypot(en.x-P.x,en.y-P.y)<0.75){touching=true;}
  }

  if(touching){
    P.hp-=DPS*dt; shake=Math.max(shake,0.7);
    dmgEl.style.opacity=String(0.55+Math.sin(time*30)*0.2);
    if(Math.random()<dt*6)beep(90,.1,'square',.05);
    drawHUD();
    if(P.hp<=0){finish(false);return;}
  }else dmgEl.style.opacity='0';

  if(!anyAlert&&Math.random()<dt*0.05&&logLines.length&&logLines[logLines.length-1].t!=='SIGNAL QUIET · NO CONTACTS')
    say('SIGNAL QUIET · NO CONTACTS');
  if(P.scan>0)drawHUD();
}

/* ══════════════ RENDER ══════════════ */
function render(){
  const ox=VW/2-camX+(shake?(Math.random()-0.5)*shake*7:0);
  const oy=VH/2-camY+(shake?(Math.random()-0.5)*shake*7:0);

  ctx.fillStyle='#01070c'; ctx.fillRect(0,0,VW,VH);

  const x0=Math.max(0,((camX-VW/2)/TS|0)-2), x1=Math.min(W-1,((camX+VW/2)/TS|0)+2);
  const y0=Math.max(0,((camY-VH/2)/TS|0)-2), y1=Math.min(H-1,((camY+VH/2)/TS|0)+2);

  // --- ground grid ---
  ctx.lineWidth=1;
  ctx.strokeStyle='rgba(79,227,255,.055)';
  ctx.beginPath();
  for(let x=x0;x<=x1+1;x++){ctx.moveTo(ox+x*TS,oy+y0*TS);ctx.lineTo(ox+x*TS,oy+(y1+1)*TS);}
  for(let y=y0;y<=y1+1;y++){ctx.moveTo(ox+x0*TS,oy+y*TS);ctx.lineTo(ox+(x1+1)*TS,oy+y*TS);}
  ctx.stroke();

  // --- floor plates (explored streets) ---
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const i=I(x,y); if(!explored[i]||map[i]===1)continue;
    ctx.fillStyle=visible[i]?'rgba(79,227,255,.055)':'rgba(79,227,255,.018)';
    ctx.fillRect(ox+x*TS+1,oy+y*TS+1,TS-2,TS-2);
  }

  // --- holographic extruded buildings ---
  const LEAN=0.075;                                  // volumetric parallax
  const seg=[];                                       // exposed edges
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const i=I(x,y); if(!explored[i]||map[i]===0)continue;
    const bx=ox+x*TS, by=oy+y*TS;
    const lx=(bx+TS/2-VW/2)*LEAN, ly=(by+TS/2-VH/2)*LEAN;
    const vis=visible[i];
    // roof plate
    ctx.fillStyle=vis?'rgba(11,58,74,.55)':'rgba(11,58,74,.22)';
    ctx.fillRect(bx+lx,by+ly,TS,TS);
    // exposed faces
    const N=solid(x,y-1),S=solid(x,y+1),Wl=solid(x-1,y),E=solid(x+1,y);
    if(!N)seg.push([bx,by,bx+TS,by,lx,ly,vis]);
    if(!S)seg.push([bx,by+TS,bx+TS,by+TS,lx,ly,vis]);
    if(!Wl)seg.push([bx,by,bx,by+TS,lx,ly,vis]);
    if(!E)seg.push([bx+TS,by,bx+TS,by+TS,lx,ly,vis]);
  }
  // side walls (base -> roof)
  ctx.lineWidth=1;
  for(const[ax,ay,bx2,by2,lx,ly,vis]of seg){
    ctx.beginPath();
    ctx.moveTo(ax,ay);ctx.lineTo(ax+lx,ay+ly);
    ctx.lineTo(bx2+lx,by2+ly);ctx.lineTo(bx2,by2);ctx.closePath();
    ctx.fillStyle=vis?'rgba(79,227,255,.10)':'rgba(79,227,255,.035)';
    ctx.fill();
    ctx.strokeStyle=vis?'rgba(79,227,255,.30)':'rgba(79,227,255,.10)';
    ctx.stroke();
  }
  // bright roof edge
  ctx.shadowBlur=9; ctx.shadowColor='rgba(79,227,255,.85)';
  ctx.beginPath();
  for(const[ax,ay,bx2,by2,lx,ly,vis]of seg){ if(!vis)continue;
    ctx.moveTo(ax+lx,ay+ly);ctx.lineTo(bx2+lx,by2+ly); }
  ctx.strokeStyle='rgba(79,227,255,.9)';ctx.lineWidth=1.2;ctx.stroke();
  ctx.shadowBlur=0;
  ctx.beginPath();
  for(const[ax,ay,bx2,by2,lx,ly,vis]of seg){ if(vis)continue;
    ctx.moveTo(ax+lx,ay+ly);ctx.lineTo(bx2+lx,by2+ly); }
  ctx.strokeStyle='rgba(79,227,255,.22)';ctx.lineWidth=1;ctx.stroke();

  // --- extraction pad ---
  if(explored[I(exit.x|0,exit.y|0)]){
    const ready=collected>=CORES_NEEDED;
    const ex=ox+exit.x*TS, ey=oy+exit.y*TS;
    const col=ready?'255,200,87':'79,227,255';
    ctx.save();ctx.translate(ex,ey);
    for(let r=0;r<3;r++){
      const rad=TS*(0.7+r*0.55)+(ready?Math.sin(time*3-r)*4:0);
      ctx.beginPath();ctx.arc(0,0,rad,0,6.283);
      ctx.strokeStyle=`rgba(${col},${ready?0.55-r*0.12:0.16})`;ctx.lineWidth=1;ctx.stroke();
    }
    ctx.rotate(time*(ready?1.1:0.25));
    ctx.beginPath();
    for(let k=0;k<3;k++){const a=k/3*6.283;ctx.moveTo(Math.cos(a)*8,Math.sin(a)*8);
      ctx.lineTo(Math.cos(a)*TS*0.8,Math.sin(a)*TS*0.8);}
    ctx.strokeStyle=`rgba(${col},${ready?0.9:0.3})`;ctx.lineWidth=1.5;
    ctx.shadowBlur=ready?14:0;ctx.shadowColor=`rgba(${col},.9)`;ctx.stroke();ctx.restore();
    ctx.shadowBlur=0;
    ctx.font='9px ui-monospace,monospace';ctx.textAlign='center';
    ctx.fillStyle=`rgba(${col},${ready?0.95:0.4})`;
    ctx.fillText(ready?'EXTRACTION · OPEN':'EXTRACTION · LOCKED',ex,ey+TS*2.1);
  }

  // --- data cores ---
  for(const c of cores){
    if(c.taken)continue;
    const i=I(c.x|0,c.y|0); if(!explored[i])continue;
    const cx=ox+c.x*TS, cy=oy+c.y*TS, bob=Math.sin(time*2.4+c.x)*3;
    const a=visible[i]?1:0.35;
    ctx.save();ctx.translate(cx,cy+bob);ctx.rotate(time*1.4);
    ctx.shadowBlur=visible[i]?14:0;ctx.shadowColor='rgba(255,200,87,.9)';
    ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(7,0);ctx.lineTo(0,9);ctx.lineTo(-7,0);ctx.closePath();
    ctx.strokeStyle=`rgba(255,200,87,${a})`;ctx.lineWidth=1.4;ctx.stroke();
    ctx.fillStyle=`rgba(255,200,87,${0.18*a})`;ctx.fill();
    ctx.restore();ctx.shadowBlur=0;
  }

  // --- planned route ---
  if(P.path.length){
    ctx.save();
    ctx.setLineDash([5,6]);ctx.lineDashOffset=-time*22;
    ctx.beginPath();ctx.moveTo(ox+P.x*TS,oy+P.y*TS);
    for(const[px,py]of P.path)ctx.lineTo(ox+px*TS,oy+py*TS);
    ctx.strokeStyle='rgba(79,227,255,.55)';ctx.lineWidth=1.2;ctx.stroke();
    const last=P.path[P.path.length-1];
    ctx.setLineDash([]);
    ctx.beginPath();ctx.arc(ox+last[0]*TS,oy+last[1]*TS,7+Math.sin(time*6)*1.6,0,6.283);
    ctx.strokeStyle='rgba(79,227,255,.75)';ctx.stroke();
    ctx.restore();
  }

  // --- enemies ---
  for(const en of enemies){
    const i=I(en.x|0,en.y|0);
    const known=visible[i]||en.alert>0&&explored[i];
    if(!known)continue;
    const ex=ox+en.x*TS, ey=oy+en.y*TS;
    // vision cone
    ctx.beginPath();ctx.moveTo(ex,ey);
    for(let k=-1;k<=1;k+=0.1){
      const a=en.ang+k*E_CONE;
      let d=E_SIGHT;
      for(let s=0.4;s<E_SIGHT;s+=0.3){
        if(solid((en.x+Math.cos(a)*s)|0,(en.y+Math.sin(a)*s)|0)){d=s;break;}
      }
      ctx.lineTo(ex+Math.cos(a)*d*TS,ey+Math.sin(a)*d*TS);
    }
    ctx.closePath();
    ctx.fillStyle=en.alert>0?'rgba(255,61,127,.14)':'rgba(255,61,127,.07)';ctx.fill();
    // body
    ctx.save();ctx.translate(ex,ey);
    ctx.shadowBlur=en.alert>0?18:8;ctx.shadowColor='rgba(255,61,127,.9)';
    ctx.rotate(time*(en.alert>0?3.4:1.1));
    ctx.beginPath();
    for(let k=0;k<6;k++){const a=k/6*6.283,r=9;
      k?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);}
    ctx.closePath();
    ctx.strokeStyle='rgba(255,61,127,.95)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='rgba(255,61,127,.2)';ctx.fill();
    ctx.restore();ctx.shadowBlur=0;
    if(en.alert>0){
      ctx.font='11px ui-monospace,monospace';ctx.textAlign='center';
      ctx.fillStyle='rgba(255,61,127,'+(0.6+Math.sin(time*12)*0.4)+')';
      ctx.fillText('!',ex,ey-16);
    }
  }

  // --- player ---
  const px=ox+P.x*TS, py=oy+P.y*TS;
  ctx.save();ctx.translate(px,py);
  for(let r=0;r<2;r++){
    const t=(time*0.9+r*0.5)%1;
    ctx.beginPath();ctx.arc(0,0,t*46,0,6.283);
    ctx.strokeStyle=`rgba(79,227,255,${(1-t)*0.3})`;ctx.lineWidth=1;ctx.stroke();
  }
  ctx.rotate(P.ang+Math.PI/2);
  ctx.shadowBlur=16;ctx.shadowColor='rgba(79,227,255,.95)';
  ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(8,8);ctx.lineTo(0,4);ctx.lineTo(-8,8);ctx.closePath();
  ctx.fillStyle='rgba(79,227,255,.35)';ctx.fill();
  ctx.strokeStyle='#9df3ff';ctx.lineWidth=1.4;ctx.stroke();
  ctx.restore();ctx.shadowBlur=0;

  // --- pulse scan wave ---
  if(pulse){
    ctx.beginPath();ctx.arc(px,py,pulse.r*TS/2,0,6.283);
    ctx.strokeStyle=`rgba(79,227,255,${pulse.life*0.7})`;ctx.lineWidth=2;
    ctx.shadowBlur=20;ctx.shadowColor='rgba(79,227,255,.8)';ctx.stroke();ctx.shadowBlur=0;
  }

  // --- fog of war ---
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const i=I(x,y);
    if(visible[i])continue;
    ctx.fillStyle=explored[i]?'rgba(1,7,12,.62)':'#01070c';
    ctx.fillRect(ox+x*TS,oy+y*TS,TS+1,TS+1);
  }
  // outside the loaded window -> solid void
  ctx.fillStyle='#01070c';
  ctx.fillRect(0,0,VW,oy+y0*TS);
  ctx.fillRect(0,oy+(y1+1)*TS,VW,VH);
  ctx.fillRect(0,0,ox+x0*TS,VH);
  ctx.fillRect(ox+(x1+1)*TS,0,VW,VH);

  // --- radar sweep over the lit area ---
  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.translate(px,py);ctx.rotate(time*0.8);
  const g=ctx.createLinearGradient(0,0,FOV_R*TS,0);
  g.addColorStop(0,'rgba(79,227,255,.10)');g.addColorStop(1,'rgba(79,227,255,0)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,FOV_R*TS,-0.34,0);ctx.closePath();ctx.fill();
  ctx.restore();
}

/* ══════════════ FLOW ══════════════ */
const veil=document.getElementById('veil'),vtitle=document.getElementById('vtitle'),
      vtext=document.getElementById('vtext'),vbtn=document.getElementById('vbtn');
function start(){ init(); state='play'; veil.classList.add('hide'); dmgEl.style.opacity='0'; }
function finish(win){
  state='over'; dmgEl.style.opacity='0';
  vtitle.textContent=win?'EXTRACTED':'SIGNAL LOST';
  vtitle.className=win?'good':'bad';
  vtext.innerHTML=win
    ? `ดึง data core ครบ ${CORES_NEEDED} ชิ้นและออกจาก Sector 7 ได้สำเร็จ<br><br>ชุดเหลือ ${Math.round(P.hp)}%`
    : `ชุดถูกทำลายกลางเมืองร้าง<br><br>เก็บ data core ได้ ${collected}/${CORES_NEEDED} ชิ้น`;
  vbtn.textContent=win?'ลุยอีกรอบ':'ลองใหม่';
  veil.classList.remove('hide');
  if(win){beep(523,.2,'triangle',.06);setTimeout(()=>beep(784,.5,'triangle',.05),180);}
  else{beep(180,.5,'sawtooth',.06);setTimeout(()=>beep(90,.8,'sawtooth',.05),200);}
}
vbtn.addEventListener('click',start);

let prev=performance.now();
function loop(now){
  const dt=Math.min((now-prev)/1000,0.05); prev=now;
  update(dt); render();
  requestAnimationFrame(loop);
}
init(); state='menu'; requestAnimationFrame(loop);
</script>
</body>
